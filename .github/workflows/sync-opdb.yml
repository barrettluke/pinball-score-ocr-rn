name: Sync OPDB Machines

on:
    schedule:
        - cron: "0 4 * * *" # Daily at 4am UTC (approx 9pm-12am US time)
    workflow_dispatch:

jobs:
    sync:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3

            - name: Setup Node.js
              uses: actions/setup-node@v3
              with:
                  node-version: "18"

            - name: Install Dependencies
              run: npm install @supabase/supabase-js dotenv ts-node typescript

            - name: Run Sync Script
              run: npx ts-node scripts/sync-opdb.ts
              env:
                  EXPO_PUBLIC_OPDB_API_KEY: ${{ secrets.EXPO_PUBLIC_OPDB_API_KEY }}
                  EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
                  SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
